name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - run: python -m pip install -r requirements-dev.txt -r requirements-check.txt
      - run: python -m pip check
      - run: python -m ruff check voicetoword tests scripts run.py
      - run: python -m bandit -q -r voicetoword run.py
      - run: python -m pip_audit --no-deps --disable-pip -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q -m 'not desktop_input'
      - name: Scan complete Git history for secrets
        shell: pwsh
        run: |
          $version = '8.30.1'
          $base = "https://github.com/gitleaks/gitleaks/releases/download/v$version"
          $asset = "gitleaks_${version}_windows_x64.zip"
          $zip = Join-Path $env:RUNNER_TEMP $asset
          $sums = Join-Path $env:RUNNER_TEMP 'gitleaks-checksums.txt'
          Invoke-WebRequest "$base/$asset" -OutFile $zip
          Invoke-WebRequest "$base/gitleaks_${version}_checksums.txt" -OutFile $sums
          $expected = ((Get-Content $sums | Where-Object { $_.EndsWith($asset) }) -split '\s+')[0]
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() -ne $expected) { throw 'Checksum mismatch' }
          $tool = Join-Path $env:RUNNER_TEMP 'gitleaks'
          Expand-Archive $zip $tool
          & "$tool/gitleaks.exe" git . --log-opts='--all' --redact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and inspect release archives
        run: python scripts/release.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: VoiceToWord-windows-x64
          path: |
            dist/*-win-x64.zip
            dist/*-source.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
